[package]
name         = "triad-runtime"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/triad-runtime"
description  = "Shared runtime support for schema-derived Signal/Nexus/SEMA triad daemons."
publish      = false

[dependencies]
thiserror = "2"

[dev-dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
