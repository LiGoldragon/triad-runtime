[package]
name         = "triad-runtime"
version      = "0.11.0"
edition      = "2024"
rust-version = "1.88.0"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/triad-runtime"
description  = "Shared runtime support for schema-derived Signal/Nexus/Memory triad daemons."
publish      = false

[features]
default = []
# Mirrors the schema-emitted wire-enum gate: the datom kinds are derived only
# with this feature on, exactly as the generated NexusWork/NexusAction do.
datom = ["dep:datom-codec", "dep:protos"]

[dependencies]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", rev = "f491b45d7dcb55e5837eddde3d5d7ca8ceaa9f01", default-features = false, features = ["macros", "tracing"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
rustix = { version = "1", default-features = false, features = ["std", "net"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead48b31e8d4f429d7fb156dd18548bbd79c1", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3", optional = true }
thiserror = "2"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
