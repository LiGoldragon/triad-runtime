[package]
name         = "triad-runtime"
version      = "0.6.1"
edition      = "2024"
rust-version = "1.88.0"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/triad-runtime"
description  = "Shared runtime support for schema-derived Signal/Nexus/SEMA triad daemons."
publish      = false

[features]
default = []
# Mirrors the schema-emitted wire-enum gate: NOTA codec derives compile only
# with the text feature on, exactly as the generated NexusWork/NexusAction do.
nota-text = ["dep:nota-next"]

[dependencies]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main", default-features = false, features = ["macros", "tracing"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
rustix = { version = "1", default-features = false, features = ["std", "net"] }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
nota-next = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main", optional = true }
thiserror = "2"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main" }
